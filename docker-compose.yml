services:
  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: fixya_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fixya_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./FixYa
      dockerfile: Dockerfile
    container_name: fixya_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fixya_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-5.4-mini}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./fixya-frontend
      dockerfile: Dockerfile
    container_name: fixya_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  fixya_postgres_data:
